<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG GAMER BOY FF — Admin Panel</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#090c13;color:#f4f6fb;font:15px Arial}.wrap{max-width:900px;margin:auto}section{padding:18px;margin:14px 0;background:#151b27;border:1px solid #30394a;border-radius:14px}h1{font-size:25px}h2{font-size:19px}label{display:block;color:#c6cede;margin:10px 0}input,textarea{display:block;width:100%;padding:11px;margin-top:6px;background:#090d15;color:#fff;border:1px solid #424d61;border-radius:8px}button{padding:11px 14px;margin:6px 5px 6px 0;border:0;border-radius:8px;font-weight:bold;cursor:pointer;background:#e9edf5;color:#111}button.secondary{background:#303b50;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{color:#a9c9ff;min-height:20px}.item{padding:10px 0;border-bottom:1px solid #343d4c;overflow-wrap:anywhere}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>RG GAMER BOY FF — Admin Panel</h1><p id="authStatus" class="msg">Dashboard ready.</p><div id="panel"><section><h2>Website Customization</h2><label>Website title<input id="siteTitle"></label><label>Welcome heading<input id="welcome"></label><label>Welcome text<textarea id="welcomeText" rows="3"></textarea></label><div class="grid"><label>Primary color<input id="primary" placeholder="#ff365d"></label><label>Background color<input id="background" placeholder="#080a11"></label><label>Logo image URL<input id="logoUrl"></label><label>Banner image URL<input id="bannerUrl"></label></div><label>Background image URL<input id="backgroundUrl"></label><button id="saveDraft" class="secondary">SAVE DRAFT</button><button id="publishSite">PUBLISH WEBSITE</button><p id="siteMsg" class="msg"></p></section><section><h2>Publish Website Update</h2><label>Update title<input id="updateTitle"></label><div class="grid"><label>Version / date<input id="version"></label><label>File size<input id="size" placeholder="1 MB"></label></div><label>Download URL<input id="updateUrl"></label><label>Details<textarea id="details" rows="3"></textarea></label><button id="publishUpdate">PUBLISH UPDATE</button><p id="updateMsg" class="msg"></p><h3>Published Updates</h3><div id="updates"></div></section><section><h2>Key → User Keys → Available Keys</h2><label>Maximum total keys users can generate<input id="keyLimit" type="number" min="1" max="100000" value="50"></label><button id="saveLimit">SAVE KEY LIMIT</button><button id="loadKeys" class="secondary">REFRESH KEY LIST</button><p id="keyMsg" class="msg"></p><div id="keys"></div></section></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';const cfg={apiKey:"AIzaSyAQc3Nefy1-4ndquvJAH6uFoZE9jw3eCa",authDomain:"rg-gamer-boy-ff-website-system.firebaseapp.com",databaseURL:"https://rg-gamer-boy-ff-website-system-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"rg-gamer-boy-ff-website-system",storageBucket:"rg-gamer-boy-ff-website-system.firebasestorage.app",messagingSenderId:"705401797172",appId:"1:705401797172:web:8afbfa27cef04889546861"};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),fn=getFunctions(app,'asia-south1'),call=n=>httpsCallable(fn,n),adminSite=call('adminSaveSite'),adminUpdate=call('adminPublishUpdate'),adminLimit=call('adminSetKeyLimit'),listKeys=call('adminListKeys'),revoke=call('adminRevokeKey');const ADMIN_UID='kKsZxAb9kEdBC29xhzdHwwGzG4n1';const $=x=>document.getElementById(x);$('panel').classList.add('hidden');$('authStatus').textContent='Checking existing Admin authorization…';onAuthStateChanged(auth,user=>{if(!user){$('panel').classList.add('hidden');$('authStatus').textContent='Authorization not found. First authorize through your separate Auth HTML in this same browser.';return;}if(user.uid!==ADMIN_UID){$('panel').classList.add('hidden');$('authStatus').textContent='Access denied: this account is not the configured Admin.';return;}$('panel').classList.remove('hidden');$('authStatus').textContent='Admin authorized. Dashboard ready.';loadSite();loadUpdates();refreshKeys();});async function loadSite(){const v=(await get(ref(db,'public/site'))).val()||{};for(const k of ['siteTitle','welcome','welcomeText','primary','background','logoUrl','bannerUrl','backgroundUrl'])$(k).value=v[k]||'';}function siteData(){const o={};for(const k of ['siteTitle','welcome','welcomeText','primary','background','logoUrl','bannerUrl','backgroundUrl'])o[k]=$(k).value.trim();return o;}$('saveDraft').onclick=async()=>{try{await adminSite({mode:'draft',site:siteData()});$('siteMsg').textContent='Draft saved.';}catch(e){$('siteMsg').textContent=e.message;}};$('publishSite').onclick=async()=>{try{await adminSite({mode:'publish',site:siteData()});$('siteMsg').textContent='Website settings published.';}catch(e){$('siteMsg').textContent=e.message;}};$('publishUpdate').onclick=async()=>{const update={title:$('updateTitle').value.trim(),version:$('version').value.trim(),size:$('size').value.trim(),url:$('updateUrl').value.trim(),details:$('details').value.trim()};try{await adminUpdate(update);$('updateMsg').textContent='Update published.';await loadUpdates();}catch(e){$('updateMsg').textContent=e.message;}};async function loadUpdates(){const v=(await get(ref(db,'public/updates'))).val()||{};$('updates').replaceChildren();Object.entries(v).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).forEach(([id,x])=>{const d=document.createElement('div');d.className='item';const t=document.createElement('span');t.textContent=`${x.title||''} — ${x.version||''} ${x.size||''}`;const b=document.createElement('button');b.className='secondary';b.textContent='DELETE';b.onclick=async()=>{try{await adminUpdate({deleteId:id});await loadUpdates();}catch(e){$('updateMsg').textContent=e.message;}};d.append(t,b);$('updates').append(d);});}$('saveLimit').onclick=async()=>{const limit=Number($('keyLimit').value);try{const r=await adminLimit({limit});$('keyMsg').textContent=`Key limit saved. ${r.data.issued} of ${r.data.limit} keys have been issued.`;}catch(e){$('keyMsg').textContent=e.message;}};$('loadKeys').onclick=refreshKeys;async function refreshKeys(){try{const r=await listKeys();$('keyLimit').value=r.data.limit;$('keys').replaceChildren();for(const k of r.data.keys){const d=document.createElement('div');d.className='item';d.textContent=`${k.key} — ${k.status} — ${k.username||'not redeemed'}`;if(k.status!=='revoked'){const b=document.createElement('button');b.className='secondary';b.textContent='REVOKE';b.onclick=async()=>{try{await revoke({key:k.key});await refreshKeys();}catch(e){$('keyMsg').textContent=e.message;}};d.append(b);}$('keys').append(d);}}catch(e){$('keyMsg').textContent=e.message;}};</script></body></html>
