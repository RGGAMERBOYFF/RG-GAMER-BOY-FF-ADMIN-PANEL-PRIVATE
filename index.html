<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG GAMER BOY FF — Admin</title><style>body{font:15px Arial;background:#0b0d13;color:#eee;margin:0;padding:18px}.wrap{max-width:850px;margin:auto}section{background:#151923;border:1px solid #343a48;border-radius:12px;padding:18px;margin:14px 0}input,textarea{box-sizing:border-box;width:100%;padding:11px;margin:7px 0 12px;background:#090c12;color:#fff;border:1px solid #444;border-radius:7px}button{padding:11px 15px;margin:5px 5px 5px 0;border:0;border-radius:7px;cursor:pointer;font-weight:bold}label{display:block;color:#c4cbd7}small{color:#9aa5b8}pre{white-space:pre-wrap;word-break:break-word;color:#c8d2e5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>RG GAMER BOY FF — Admin Panel</h1><section id="login"><h2>Admin Login</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">LOGIN</button><p id="loginMsg"></p><small>Only the authorized Firebase admin account can access this panel.</small></section><div id="panel" hidden><button id="logout">LOG OUT</button><section><h2>Website Customization</h2><label>Website title<input id="siteTitle"></label><label>Welcome heading<input id="welcome"></label><label>Welcome text<textarea id="welcomeText" rows="3"></textarea></label><div class="grid"><div><label>Primary color<input id="primary" placeholder="#ff365d"></label><label>Background color<input id="background" placeholder="#080a11"></label></div><div><label>Logo image URL<input id="logoUrl" placeholder="https://..."></label><label>Banner image URL<input id="bannerUrl" placeholder="https://..."></label></div></div><label>Background image URL<input id="backgroundUrl" placeholder="https://..."></label><button id="saveDraft">SAVE DRAFT</button><button id="publishSite">PUBLISH WEBSITE</button><p id="siteMsg"></p></section><section><h2>Launch Website Update</h2><label>Update title<input id="updateTitle"></label><label>Version / date<input id="version"></label><label>File size (enter your own, e.g. 1 KB or 1 MB)<input id="size" placeholder="1 MB"></label><label>Download / update URL<input id="updateUrl" placeholder="https://..."></label><label>Update details<textarea id="details" rows="4"></textarea></label><button id="publishUpdate">PUBLISH UPDATE</button><p id="updateMsg"></p><h3>Published updates</h3><div id="updates"></div></section><section><h2>Access Key Overview</h2><p>Keys are generated on the User Key page. You can view status and revoke a key here.</p><button id="loadKeys">REFRESH KEY LIST</button><div id="keys"></div><p id="keyMsg"></p></section></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getDatabase,ref,get,set,update,remove}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';const c={apiKey:"AIzaSyAQc3Nefy1-4ndquvJAH6uFoZE9jw3eCa",authDomain:"rg-gamer-boy-ff-website-system.firebaseapp.com",databaseURL:"https://rg-gamer-boy-ff-website-system-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"rg-gamer-boy-ff-website-system",storageBucket:"rg-gamer-boy-ff-website-system.firebasestorage.app",messagingSenderId:"705401797172",appId:"1:705401797172:web:8afbfa27cef04889546861"};const app=initializeApp(c),auth=getAuth(app),db=getDatabase(app),fn=getFunctions(app,'asia-south1'),listKeys=httpsCallable(fn,'adminListKeys'),revokeKey=httpsCallable(fn,'adminRevokeKey');const ADMIN_UID='kKsZxAb9kEdBC29xhzdHwwGzG4n1', $=x=>document.getElementById(x);$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('loginMsg').textContent=e.message}};onAuthStateChanged(auth,async u=>{if(u&&u.uid===ADMIN_UID){$('login').hidden=true;$('panel').hidden=false;await loadSite();await loadUpdates();}else{$('login').hidden=false;$('panel').hidden=true;if(u)await signOut(auth);}});$('logout').onclick=()=>signOut(auth);async function loadSite(){const s=(await get(ref(db,'public/site'))).val()||{};for(const k of ['siteTitle','welcome','welcomeText','primary','background','logoUrl','bannerUrl','backgroundUrl'])$(k).value=s[k]||'';}function siteData(){return{siteTitle:$('siteTitle').value,welcome:$('welcome').value,welcomeText:$('welcomeText').value,primary:$('primary').value,background:$('background').value,logoUrl:$('logoUrl').value,bannerUrl:$('bannerUrl').value,backgroundUrl:$('backgroundUrl').value,updatedAt:Date.now()}}$('saveDraft').onclick=async()=>{await set(ref(db,'adminDraft/site'),siteData());$('siteMsg').textContent='Draft saved.'};$('publishSite').onclick=async()=>{await set(ref(db,'public/site'),siteData());$('siteMsg').textContent='Website settings published.'};$('publishUpdate').onclick=async()=>{const id='u_'+Date.now();const v={title:$('updateTitle').value,version:$('version').value,size:$('size').value,url:$('updateUrl').value,details:$('details').value,createdAt:Date.now()};if(!v.title||!v.url){$('updateMsg').textContent='Title and URL are required.';return;}await set(ref(db,'public/updates/'+id),v);$('updateMsg').textContent='Update published.';await loadUpdates();};async function loadUpdates(){const v=(await get(ref(db,'public/updates'))).val()||{};$('updates').innerHTML='';Object.entries(v).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).forEach(([id,x])=>{const d=document.createElement('div');d.innerHTML='<b></b> — <span></span> <button>DELETE</button>';d.querySelector('b').textContent=x.title||'';d.querySelector('span').textContent=(x.version||'')+' '+(x.size||'');d.querySelector('button').onclick=async()=>{await remove(ref(db,'public/updates/'+id));loadUpdates()};$('updates').append(d)});} $('loadKeys').onclick=async()=>{try{const r=await listKeys();$('keys').innerHTML='';for(const k of r.data.keys||[]){const d=document.createElement('div');d.textContent=k.key+' — '+k.status+' — '+(k.username||'not redeemed')+' ';if(k.status!=='revoked'){const b=document.createElement('button');b.textContent='REVOKE';b.onclick=async()=>{await revokeKey({key:k.key});$('keyMsg').textContent='Key revoked';$('loadKeys').click()};d.append(b)}$('keys').append(d)}}catch(e){$('keyMsg').textContent=e.message}};</script></body></html>
